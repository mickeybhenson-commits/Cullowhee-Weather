# Monthly land-surface change watch for Cullowhee Creek.
#
# Runs on the 5th so the previous month's Sentinel-2 scenes are fully
# catalogued. Compares that month against the SAME month one year earlier —
# never the previous month, which in a deciduous watershed is phenology.
#
# This job writes feed/landcover_watch.csv and a patch file. It does NOT touch
# basins.py. Confirmed patches are input to the quarterly human review; the CN
# write is annual and gated. See
# claude/noah_cn_sensitivity_and_imagery_cadence_2026-08-10.md for why.

name: land-cover watch (monthly)

on:
  schedule:
    - cron: "23 7 5 * *"        # 5th of each month, 07:23 UTC — off the hour on purpose
  workflow_dispatch:
    inputs:
      month:
        description: "DRIFT mode: month to analyse as YYYY-MM (blank = previous month)"
        required: false
        default: ""
      event_before:
        description: "EVENT mode: the month BEFORE the storm, YYYY-MM (leave blank for drift)"
        required: false
        default: ""
      event_after:
        description: "EVENT mode: the month AFTER the storm, YYYY-MM"
        required: false
        default: ""
      use_corridor:
        description: "EVENT mode only: mask to the riparian corridor"
        type: boolean
        required: false
        default: true

concurrency:
  group: landcover-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy shapely pyproj rasterio pystac-client planetary-computer

      - name: Self-test the detection logic
        run: python noah_landcover_watch.py --selftest

      - name: Resolve target month
        id: m
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            echo "month=${{ github.event.inputs.month }}" >> "$GITHUB_OUTPUT"
          else
            echo "month=$(date -u -d 'last month' +%Y-%m)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the watch
        run: |
          B="${{ github.event.inputs.event_before }}"
          A="${{ github.event.inputs.event_after }}"
          if [ -n "$B" ] && [ -n "$A" ]; then
            CORR=""
            if [ "${{ github.event.inputs.use_corridor }}" = "true" ]; then
              if [ -f cullowhee_riparian.geojson ]; then
                CORR="--corridor cullowhee_riparian.geojson"
              else
                echo "::error::use_corridor was requested but cullowhee_riparian.geojson is missing."
                echo "::error::Run the 'build riparian corridor (one-shot)' workflow first."
                exit 1
              fi
            fi
            python noah_landcover_watch.py --event "$B" "$A" $CORR \
              --basins cullowhee_subbasins_incremental.geojson --out feed
          elif [ -n "$B" ] || [ -n "$A" ]; then
            echo "::error::EVENT mode needs BOTH event_before and event_after."
            exit 1
          else
            python noah_landcover_watch.py \
              --month "${{ steps.m.outputs.month }}" \
              --basins cullowhee_subbasins_incremental.geojson \
              --out feed
          fi

      # main is written continuously by the live-feed job, so by the time a
      # 2-minute analysis finishes the remote has almost always moved. A plain
      # push loses that race and the whole run is discarded — which is how the
      # first corrected Helene run was lost. Rebase and retry.
      #
      # Stage the whole feed/ directory: the ledger migration can also emit a
      # rotated copy, and naming files explicitly meant that copy was silently
      # left behind.
      - name: Commit the ledger
        run: |
          git config user.name  "noah-landcover-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A feed/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "land-cover watch ${{ steps.m.outputs.month }}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i — rebasing onto origin/main"
            sleep $(( i * 5 ))
            git pull --rebase --autostash origin main || {
              echo "::error::rebase failed — a human needs to look at this"
              exit 1
            }
          done
          echo "::error::could not push the ledger after 5 attempts"
          exit 1
