name: publish-feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-feed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feed
        env:
          CULLOWHEE_SHADOW_MODE: "1"
          CULLOWHEE_DATUM_VERIFIED: "0"
          # WeatherNext 2 outlook (feed/outlook.json). Until these are set the
          # outlook publishes an honest "unavailable" status and nothing else
          # changes. After Google's data-request approval: set the WN_BQ_TABLE
          # repo secret and add a google-github-actions/auth step above this
          # one (BigQuery needs ADC; see weathernext_source.py [CONFIRM]).
          WN_BQ_TABLE: ${{ secrets.WN_BQ_TABLE }}
          # learned per-basin orographic multipliers from the QPF ledger,
          # e.g. {"CC-UP-503": 1.35} — leave unset until a season verifies
          WN_BIAS_MULT_JSON: ${{ vars.WN_BIAS_MULT_JSON }}
        run: python feed_runner.py

      - name: Watch the state feed
        continue-on-error: true
        run: python fiman_watch.py

      - name: Push posture notifications
        continue-on-error: true
        env:
          # ntfy.sh topic — set the repo secret to enable phone pushes;
          # unset = notifier idles with a log line (see notify_posture.py)
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify_posture.py

      - name: Sanity check the feed
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("feed/feed_meta.json"))
          if m["stale_sites"]:
              print("::warning::stale sites in feed: %s" % m["stale_sites"])
          if m["site_count"] == 0:
              sys.exit("refusing to publish an empty feed")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A feed
          git diff --staged --quiet && exit 0
          git commit -m "feed: $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin main
          git push
