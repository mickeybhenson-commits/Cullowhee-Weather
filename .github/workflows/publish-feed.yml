name: publish-feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-feed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate feed
        env:
          CULLOWHEE_SHADOW_MODE: "1"
          CULLOWHEE_DATUM_VERIFIED: "0"
        run: python publish_feed.py

      - name: Sanity check the feed
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("feed/feed_meta.json"))
          if m["stale_sites"]:
              print("::warning::stale sites in feed: %s" % m["stale_sites"])
          if m["site_count"] == 0:
              sys.exit("refusing to publish an empty feed")
          PY

      - name: Commit if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed/gages.geojson feed/feed_meta.json
          git diff --staged --quiet || git commit -m "feed: $(date -u +%FT%TZ)"
          git push
